name: Build Windows
on: workflow_dispatch
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow pyinstaller
      - run: pyinstaller --onefile --noconsole --name WidgetImagenes --icon mollyicono.ico --add-data "imagenes;imagenes" widget.py
      - uses: actions/upload-artifact@v4
        with:
          name: WidgetImagenes
          path: dist/WidgetImagenes.exe
